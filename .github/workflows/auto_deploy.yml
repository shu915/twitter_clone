name: Auto Deploy

on:
  push:
    branches:
      - main

env:
  ECS_CLUSTER_NAME: xclone-cluster
  ECS_SERVICE_NAME: xclone-service2
  ECS_TASK_DEFINITION_FILE: .aws/task_definition.json
  ECR_REGISTRY_NAME: xclone-ecr
  ECR_REGISTRY_URI: 575357958164.dkr.ecr.ap-northeast-1.amazonaws.com
  AWS_REGION: ap-northeast-1
  AWS_ROLE_TO_ASSUME: arn:aws:iam::575357958164:role/xclone-github-actions

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push image to ECR
        id: build-and-push
        run: |
          docker build -t $ECR_REGISTRY_NAME .
          docker tag $ECR_REGISTRY_NAME:latest $ECR_REGISTRY_URI/$ECR_REGISTRY_NAME:latest
          docker push $ECR_REGISTRY_URI/$ECR_REGISTRY_NAME:latest

      - name: Render Amazon ECS task definition
        id: render-web-container
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION_FILE }}
          container-name: xclone
          image: ${{ env.ECR_REGISTRY_URI }}/${{ env.ECR_REGISTRY_NAME }}:latest
    
      - name: Deploy to Amazon ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-web-container.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_NAME }}
          cluster: ${{ env.ECS_CLUSTER_NAME }}
          wait-for-service-stability: true
          force-new-deployment: true